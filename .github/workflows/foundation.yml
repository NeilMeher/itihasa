name: Foundation checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version-file: research/.python-version
      - run: npm ci
      - run: python -m pip install uv==0.13.10
      - run: uv sync --locked --project research
      - run: uv run --locked --project research python research/check_evidence.py
      - run: uv run --locked --project research python research/check_beta_content.py
      - run: uv run --locked --project research python research/check_mahabharata.py
      - run: uv run --locked --project research python research/build_coverage_registry.py --check
      - run: uv run --locked --project research python research/build_mahabharata_sky.py --check
      - run: uv run --locked --project research python research/run_arundhati_history.py --check
      - run: uv run --locked --project research python -m unittest discover -s research
      - run: npm run contracts:generate
      - run: git diff --exit-code -- packages/contracts
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser
